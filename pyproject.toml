[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capsnet-breast-cancer-detection"
version = "1.0.0"
description = "Capsule networks vs. CNNs for metastatic breast cancer detection in lymph node histopathology (PatchCamelyon)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vlad A. Nicolescu" }, { name = "Vlad Barbulescu" }, { name = "Andrei Pavel" }]
keywords = ["capsule networks", "dynamic routing", "CNN", "histopathology", "breast cancer", "PatchCamelyon", "medical imaging", "PyTorch"]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pillow>=10",
    "scikit-learn>=1.3",
    "pandas>=2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
